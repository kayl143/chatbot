<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BAI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #e7e3d8;
    --ink: #1c2333;
    --ink-soft: #6b7280;
    --accent: #3654a6;
    --accent-dark: #24407f;
    --accent-bright: #5b7fd6;
    --accent-soft: #edf1fb;
    --coral: #e8815f;
    --error: #c0392b;
    --error-soft: #fbeceb;
    --online: #3ea97a;
    --radius-lg: 22px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(54, 84, 166, 0.07), transparent 42%),
      radial-gradient(circle at 88% 90%, rgba(232, 129, 95, 0.06), transparent 45%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .shell {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 760px;
    background: var(--card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(28, 35, 51, 0.05), 0 24px 48px -20px rgba(28, 35, 51, 0.28);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  button { font-family: inherit; }
  input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Brand mark ---------- */
  .mark, .mark-lg {
    flex-shrink: 0;
    display: block;
  }
  .mark { width: 34px; height: 34px; }
  .mark-lg {
    width: 60px;
    height: 60px;
    filter: drop-shadow(0 12px 28px rgba(54, 84, 166, 0.45));
  }

  /* ================= LOGIN VIEW ================= */
  #login-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 28px 28px;
    overflow-y: auto;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 0 30px;
    animation: fadeUp 0.5s ease both;
  }
  .hero .mark-lg { margin-bottom: 16px; }
  .hero .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.04em;
    margin: 0;
    background: linear-gradient(120deg, var(--accent-dark), var(--accent-bright) 65%, var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero .tagline {
    margin: 6px 0 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .login-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 24px 22px 22px;
    animation: fadeUp 0.55s ease 0.05s both;
  }

  .login-heading h1 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .login-heading p {
    margin: 0 0 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .tabs {
    display: flex;
    background: var(--paper);
    border-radius: var(--radius-sm);
    padding: 3px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(28, 35, 51, 0.08);
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #b9b7ae; }

  .forgot-link {
    display: block;
    text-align: right;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    margin: -6px 0 18px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    width: 100%;
  }

  .primary-btn {
    width: 100%;
    padding: 12px 0;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .primary-btn:hover { background: var(--accent-dark); }
  .primary-btn:active { transform: scale(0.99); }
  .primary-btn:disabled { opacity: 0.6; cursor: default; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .google-btn {
    width: 100%;
    padding: 11px 0;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .google-btn:hover { border-color: #cfcbbd; background: #fbfaf7; }
  .google-btn svg { width: 17px; height: 17px; }

  .guest-link {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .guest-link:hover { color: var(--ink); }

  .auth-error {
    background: var(--error-soft);
    color: var(--error);
    font-size: 12.5px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    display: none;
    line-height: 1.4;
  }
  .auth-error.show { display: block; }

  .apk-note {
    padding-top: 20px;
    font-size: 11px;
    color: #a8a59a;
    text-align: center;
    line-height: 1.5;
  }

  /* ================= CHAT VIEW ================= */
  #app-view {
    display: none;
    flex-direction: column;
    height: 100%;
  }
  #app-view.active { display: flex; }
  #login-view.hidden { display: none; }
  #app-view { position: relative; }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    background: var(--card);
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- History drawer ---------- */
  .drawer-overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 24, 38, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 82%;
    max-width: 300px;
    background: var(--card);
    border-right: 1px solid var(--line);
    z-index: 11;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    box-shadow: 12px 0 32px -12px rgba(28, 35, 51, 0.25);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .drawer-header h2 {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }

  .new-chat-btn {
    margin: 12px 14px;
    padding: 10px 12px;
    border: 1.5px dashed var(--line);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .new-chat-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .new-chat-btn svg { width: 15px; height: 15px; }

  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .conv-item {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 10px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--ink);
  }
  .conv-item:hover { background: var(--paper); }
  .conv-item.active { background: var(--accent-soft); }
  .conv-item .conv-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .conv-item .conv-meta {
    font-size: 11px;
    color: var(--ink-soft);
  }

  .conv-empty {
    padding: 20px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.5;
  }

  .chat-header .app-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    margin: 0;
    color: var(--ink);
    flex: 1;
  }
  .chat-header .status {
    font-size: 11px;
    color: var(--online);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .chat-header .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--online);
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 4px 6px 4px 4px;
    border-radius: 20px;
    border: none;
    background: transparent;
  }
  .user-chip:hover { background: var(--paper); }
  .user-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .signout-icon {
    width: 15px;
    height: 15px;
    color: var(--ink-soft);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--paper);
  }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeUp 0.2s ease both;
  }
  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(145deg, var(--accent-bright), var(--accent));
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px -6px rgba(54, 84, 166, 0.5);
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .typing-dots {
    display: inline-flex;
    gap: 3px;
    padding: 3px 0;
  }
  .typing-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .image-preview {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 16px;
    background: var(--paper);
    overflow-x: auto;
  }
  .image-preview-item {
    position: relative;
    flex-shrink: 0;
  }
  .image-preview-item img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: block;
  }
  .image-preview-item button {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    background: var(--card);
  }

  .input-bar input {
    flex: 1;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 22px;
    font-size: 14px;
    outline: none;
    background: var(--paper);
  }
  .input-bar input:focus { border-color: var(--accent); background: var(--card); }

  .input-bar button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent-bright), var(--accent-dark));
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 12px -4px rgba(54, 84, 166, 0.55);
  }
  .input-bar button:hover { box-shadow: 0 6px 16px -4px rgba(54, 84, 166, 0.65); }
  .input-bar button:active { transform: scale(0.94); }
  .input-bar button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  .input-bar button svg { width: 17px; height: 17px; }

  @media (prefers-reduced-motion: reduce) {
    .typing-dots span { animation: none; }
    .primary-btn, .input-bar button { transition: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bai-mark" viewBox="0 0 100 100">
      <linearGradient id="baiMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4F46E5"/>
        <stop offset="100%" stop-color="#0EA5E9"/>
      </linearGradient>
      <rect width="100" height="100" rx="22" fill="url(#baiMarkGrad)"/>
      <line x1="50" y1="23" x2="50" y2="14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="10" r="4.5" fill="#FFD166"/>
      <rect x="27" y="24" width="46" height="38" rx="14" fill="#FFFFFF"/>
      <circle cx="40" cy="41" r="4.5" fill="#4F46E5"/>
      <circle cx="60" cy="41" r="4.5" fill="#4F46E5"/>
      <path d="M 40 50 Q 50 58 60 50" stroke="#4F46E5" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="shell">

  <!-- ================= LOGIN VIEW ================= -->
  <div id="login-view">
    <div class="hero">
      <svg class="mark-lg"><use href="#bai-mark"/></svg>
      <h1 class="wordmark">BAI</h1>
      <p class="tagline">Buddy Artificial Intelligence</p>
    </div>

    <div class="login-card">
      <div class="login-heading">
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-subtitle">Sign in to keep chatting with BAI.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-mode="signin" type="button">Sign in</button>
        <button class="tab-btn" data-mode="signup" type="button">Create account</button>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <form id="auth-form">
        <div class="field">
          <label for="email">Gmail address</label>
          <input id="email" type="email" placeholder="you@gmail.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
        </div>
        <button type="button" id="forgot-btn" class="forgot-link">Forgot password?</button>
        <button type="submit" id="auth-submit" class="primary-btn">Sign in</button>
      </form>

      <div class="divider">or</div>

      <button type="button" id="google-btn" class="google-btn">
        <svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <button type="button" id="guest-btn" class="guest-link">Continue as guest</button>
    </div>

    <p class="apk-note">Packaging this as an APK? Google sign-in needs a Custom Tab / Chrome-backed WebView, not a plain embedded one — see the note below the code.</p>
  </div>

  <!-- ================= CHAT VIEW ================= -->
  <div id="app-view">
    <header class="chat-header">
      <button id="history-btn" class="icon-btn" type="button" title="Chat history" aria-label="Chat history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="14" y2="18"/></svg>
      </button>
      <svg class="mark"><use href="#bai-mark"/></svg>
      <p class="app-name">BAI</p>
      <span class="status">Online</span>
      <button id="user-chip" class="user-chip" type="button" title="Sign out">
        <span id="user-avatar" class="user-avatar">?</span>
        <svg class="signout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <div id="msgs" class="messages"></div>

    <div id="image-preview" class="image-preview" hidden></div>

    <form id="chat-form" class="input-bar">
      <button id="photo-btn" class="icon-btn" type="button" title="Take or attach a photo" aria-label="Take or attach a photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input id="photo-input" type="file" accept="image/*" capture="environment" multiple hidden />
      <input id="inp" type="text" placeholder="Message BAI..." autocomplete="off" />
      <button type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="drawer" class="drawer">
      <div class="drawer-header">
        <h2>Chat history</h2>
        <button id="drawer-close" class="icon-btn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <div id="conv-list" class="conv-list"></div>
    </aside>
  </div>

</div>

<!--
  This frontend sends chat messages to a backend proxy at BACKEND_URL.
  Run the backend locally with `node server.js` and set GROQ_API_KEY in your environment.

  Firebase Authentication note:
  Fill in FIREBASE_CONFIG below with your project's config (Firebase console →
  Project settings → General → Your apps → SDK setup and configuration).
  This uses the Firebase JS SDK (modular v10) loaded from the CDN, which works
  in a normal browser and in most Android WebView wrappers (Capacitor, Cordova,
  WebView-based APK builders) as long as:
    1. The WebView has JavaScript AND DOM storage enabled
       (Android: settings.setJavaScriptEnabled(true), settings.setDomStorageEnabled(true))
       — without DOM storage, Firebase Auth can't persist the signed-in session.
    2. The app has the INTERNET permission.
    3. Your Firebase project's "Authorized domains" list (Authentication → Settings)
       includes the domain/origin your APK serves this file from.

  Google Sign-In specifically: Google blocks OAuth inside a generic embedded
  WebView for security reasons, so signInWithPopup/signInWithRedirect may fail
  or be rejected in a stock Android WebView. If you need Google sign-in in a
  real APK, either (a) launch it in a Chrome Custom Tab / external browser and
  hand the result back to the app, or (b) use the native Firebase Auth Android
  SDK via a Capacitor/Cordova plugin instead of this JS SDK for that one flow.
  Email/password auth (used by default here) works fine in a plain WebView.
-->

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAnalytics
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInAnonymously,
  signInWithPopup,
  GoogleAuthProvider,
  sendPasswordResetEmail,
  sendEmailVerification,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  doc,
  query,
  orderBy,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA8YvqLAa358uBEV4bd7qbSi7wv6h1izMg",
  authDomain: "bai-chatbot.firebaseapp.com",
  projectId: "bai-chatbot",
  storageBucket: "bai-chatbot.firebasestorage.app",
  messagingSenderId: "740003846823",
  appId: "1:740003846823:web:4d298273b15c5d63089982",
  measurementId: "G-JP8381QHKE"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

// Point this at your backend proxy (server.js), not directly at Groq.
// When the UI is served by the same Express app, a relative path keeps it portable.
const BACKEND_URL = "/chat";

// ---------------- Elements ----------------
const loginView = document.getElementById("login-view");
const appView = document.getElementById("app-view");
const authForm = document.getElementById("auth-form");
const authTitle = document.getElementById("auth-title");
const authSubtitle = document.getElementById("auth-subtitle");
const authSubmit = document.getElementById("auth-submit");
const authError = document.getElementById("auth-error");
const tabButtons = document.querySelectorAll(".tab-btn");
const forgotBtn = document.getElementById("forgot-btn");
const googleBtn = document.getElementById("google-btn");
const guestBtn = document.getElementById("guest-btn");
const userAvatar = document.getElementById("user-avatar");
const userChip = document.getElementById("user-chip");

const msgs = document.getElementById("msgs");
const chatForm = document.getElementById("chat-form");
const inp = document.getElementById("inp");
const sendButton = chatForm.querySelector("button");

const historyBtn = document.getElementById("history-btn");
const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawer-overlay");
const drawerClose = document.getElementById("drawer-close");
const newChatBtn = document.getElementById("new-chat-btn");
const convList = document.getElementById("conv-list");

let mode = "signin"; // or "signup"
let history = [];
let currentUid = null;
let currentConvId = null;

// ---------------- Drawer ----------------
function openDrawer() {
  drawer.classList.add("open");
  drawerOverlay.classList.add("open");
}
function closeDrawer() {
  drawer.classList.remove("open");
  drawerOverlay.classList.remove("open");
}
historyBtn.addEventListener("click", () => {
  openDrawer();
  if (currentUid) renderConvList(currentUid);
});
drawerClose.addEventListener("click", closeDrawer);
drawerOverlay.addEventListener("click", closeDrawer);

// ---------------- Auth UI helpers ----------------
function setMode(next) {
  mode = next;
  tabButtons.forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === mode));
  const isSignup = mode === "signup";
  authTitle.textContent = isSignup ? "Create your account" : "Welcome back";
  authSubtitle.textContent = isSignup
    ? "Set up an account to start chatting with BAI."
    : "Sign in to keep chatting with BAI.";
  authSubmit.textContent = isSignup ? "Create account" : "Sign in";
  document.getElementById("password").autocomplete = isSignup ? "new-password" : "current-password";
  hideAuthError();
}

tabButtons.forEach((btn) => btn.addEventListener("click", () => setMode(btn.dataset.mode)));

function showAuthError(message, isSuccess) {
  authError.textContent = message;
  authError.classList.add("show");
  authError.style.color = isSuccess ? "var(--online)" : "";
  authError.style.background = isSuccess ? "#e9f7f0" : "";
}
function hideAuthError() {
  authError.classList.remove("show");
  authError.style.color = "";
  authError.style.background = "";
}

// Only real Gmail addresses are accepted for email/password sign-up.
function isGmailAddress(email) {
  return /^[^\s@]+@gmail\.com$/i.test(email.trim());
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : "";
  const map = {
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/user-not-found": "No account found with that email.",
    "auth/wrong-password": "Incorrect password. Try again.",
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/email-already-in-use": "An account already exists with that email.",
    "auth/weak-password": "Use a password with at least 6 characters.",
    "auth/popup-closed-by-user": "Sign-in was closed before finishing.",
    "auth/network-request-failed": "Network error — check your connection."
  };
  return (map[code] || "Something went wrong. Please try again.") + (code ? ` [${code}]` : "");
}

function setAuthSubmitting(isSubmitting) {
  authSubmit.disabled = isSubmitting;
  authSubmit.textContent = isSubmitting
    ? "Please wait..."
    : mode === "signup" ? "Create account" : "Sign in";
}

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  hideAuthError();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!isGmailAddress(email)) {
    showAuthError("Please use a real Gmail address (must end in @gmail.com).");
    return;
  }

  setAuthSubmitting(true);
  try {
    if (mode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await sendEmailVerification(cred.user);
      await signOut(auth);
      showAuthError(
        "Almost there — we sent a verification link to " + email + ". Verify it, then sign in.",
        true
      );
      setMode("signin");
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      if (!cred.user.emailVerified) {
        await sendEmailVerification(cred.user);
        await signOut(auth);
        showAuthError(
          "Please verify your Gmail address first — we just resent the verification link."
        );
        return;
      }
      // onAuthStateChanged will handle the rest once verification is confirmed.
    }
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  } finally {
    setAuthSubmitting(false);
  }
});

forgotBtn.addEventListener("click", async () => {
  hideAuthError();
  const email = document.getElementById("email").value.trim();
  if (!email) {
    showAuthError("Enter your email above first, then tap \"Forgot password?\"");
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    showAuthError("Password reset email sent — check your inbox.", true);
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  }
});

googleBtn.addEventListener("click", async () => {
  hideAuthError();
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  }
});

guestBtn.addEventListener("click", async () => {
  hideAuthError();
  try {
    await signInAnonymously(auth);
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  }
});

userChip.addEventListener("click", async () => {
  await signOut(auth);
  history = [];
  currentUid = null;
  currentConvId = null;
  msgs.innerHTML = "";
  convList.innerHTML = "";
  closeDrawer();
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    // Safety net for sessions signed in before the Gmail-verification
    // requirement existed: kick out any unverified email/password user.
    const isPasswordUser = user.providerData.some((p) => p.providerId === "password");
    if (isPasswordUser && !user.emailVerified) {
      await signOut(auth);
      showAuthError("Please verify your Gmail address before signing in — check your inbox.");
      return;
    }

    loginView.classList.add("hidden");
    appView.classList.add("active");
    const label = user.isAnonymous ? "Guest" : (user.email || "?");
    userAvatar.textContent = label.charAt(0).toUpperCase();
    userChip.title = `Signed in as ${label} — tap to sign out`;
    currentUid = user.uid;
    await openMostRecentOrNewConversation(user.uid);
  } else {
    appView.classList.remove("active");
    loginView.classList.remove("hidden");
  }
});

// ---------------- Firestore: conversations + messages ----------------
function conversationsCollection(uid) {
  return collection(db, "chats", uid, "conversations");
}
function messagesCollection(uid, convId) {
  return collection(db, "chats", uid, "conversations", convId, "messages");
}

async function fetchConversations(uid) {
  const q = query(conversationsCollection(uid), orderBy("updatedAt", "desc"));
  const snap = await getDocs(q);
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

async function openMostRecentOrNewConversation(uid) {
  try {
    const convos = await fetchConversations(uid);
    if (convos.length > 0) {
      await loadConversation(uid, convos[0].id);
    } else {
      await startNewConversation(uid);
    }
  } catch (err) {
    console.error("Failed to load conversations:", err);
    msgs.innerHTML = "";
    addBubble("assistant", "Hi, I'm BAI! Ask me anything.");
  }
}

async function startNewConversation(uid) {
  const convRef = await addDoc(conversationsCollection(uid), {
    title: "New chat",
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
  currentConvId = convRef.id;
  history = [];
  msgs.innerHTML = "";
  addBubble("assistant", "Hi, I'm BAI! Ask me anything.");
  closeDrawer();
}

async function loadConversation(uid, convId) {
  currentConvId = convId;
  msgs.innerHTML = "";
  history = [];
  try {
    const q = query(messagesCollection(uid, convId), orderBy("createdAt", "asc"));
    const snap = await getDocs(q);
    snap.forEach((docSnap) => {
      const { role, content } = docSnap.data();
      addBubble(role, content);
      history.push({ role, content });
    });
  } catch (err) {
    console.error("Failed to load conversation:", err);
  }
  if (!msgs.hasChildNodes()) {
    addBubble("assistant", "Hi, I'm BAI! Ask me anything.");
  }
  closeDrawer();
}

async function saveMessage(uid, convId, role, content) {
  try {
    await addDoc(messagesCollection(uid, convId), {
      role,
      content,
      createdAt: serverTimestamp()
    });
    const updates = { updatedAt: serverTimestamp() };
    // Title the conversation from the first user message
    if (role === "user" && history.filter((m) => m.role === "user").length === 1) {
      updates.title = content.length > 40 ? content.slice(0, 40) + "…" : content;
    }
    await updateDoc(doc(db, "chats", uid, "conversations", convId), updates);
  } catch (err) {
    console.error("Failed to save message:", err);
  }
}

function timeAgo(date) {
  if (!date) return "";
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  if (seconds < 60) return "Just now";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days}d ago`;
  return date.toLocaleDateString();
}

async function renderConvList(uid) {
  convList.innerHTML = "<p class=\"conv-empty\">Loading…</p>";
  try {
    const convos = await fetchConversations(uid);
    if (convos.length === 0) {
      convList.innerHTML = "<p class=\"conv-empty\">No past conversations yet.</p>";
      return;
    }
    convList.innerHTML = "";
    convos.forEach((conv) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "conv-item" + (conv.id === currentConvId ? " active" : "");
      const title = document.createElement("div");
      title.className = "conv-title";
      title.textContent = conv.title || "New chat";
      const meta = document.createElement("div");
      meta.className = "conv-meta";
      meta.textContent = conv.updatedAt ? timeAgo(conv.updatedAt.toDate()) : "";
      btn.appendChild(title);
      btn.appendChild(meta);
      btn.addEventListener("click", () => loadConversation(uid, conv.id));
      convList.appendChild(btn);
    });
  } catch (err) {
    console.error("Failed to render conversation list:", err);
    convList.innerHTML = "<p class=\"conv-empty\">Couldn't load history.</p>";
  }
}

newChatBtn.addEventListener("click", () => {
  if (currentUid) startNewConversation(currentUid);
});

// ---------------- Chat logic ----------------
function addBubble(role, text, imageDataUrls) {
  const bubble = document.createElement("div");
  bubble.className = "bubble " + role;
  const images = Array.isArray(imageDataUrls) ? imageDataUrls : (imageDataUrls ? [imageDataUrls] : []);
  if (images.length) {
    const grid = document.createElement("div");
    grid.style.cssText = "display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;";
    images.forEach((src) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = "Attached photo";
      img.style.cssText = "display:block; width:110px; height:110px; object-fit:cover; border-radius:12px;";
      grid.appendChild(img);
    });
    bubble.appendChild(grid);
  }
  if (text) {
    const textNode = document.createElement("div");
    textNode.textContent = text;
    bubble.appendChild(textNode);
  }
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function addTypingBubble() {
  const bubble = document.createElement("div");
  bubble.className = "bubble assistant";
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function setLoading(isLoading) {
  inp.disabled = isLoading;
  sendButton.disabled = isLoading;
}

async function sendMessage(text, imageDataUrls) {
  const user = auth.currentUser;
  const images = Array.isArray(imageDataUrls) ? imageDataUrls : (imageDataUrls ? [imageDataUrls] : []);

  addBubble("user", text, images);
  history.push({ role: "user", content: text });
  if (user && currentConvId) saveMessage(user.uid, currentConvId, "user", text);

  const thinking = addTypingBubble();
  setLoading(true);

  try {
    if (!user) {
      throw new Error("Not signed in");
    }

    const idToken = await user.getIdToken();

    const payload = { messages: history };
    if (images.length) payload.images = images;

    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify(payload)
    });

    if (response.status === 401) {
      throw new Error("Your session expired — sign in again.");
    }

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || "Backend returned " + response.status);
    }

    const data = await response.json();
    const reply = data.reply || "Sorry, I didn't get a response.";
    thinking.textContent = reply;
    history.push({ role: "assistant", content: reply });
    if (currentConvId) saveMessage(user.uid, currentConvId, "assistant", reply);
  } catch (err) {
    thinking.textContent = "Couldn't reach BAI. Check your connection or backend.";
    console.error(err);
  } finally {
    setLoading(false);
  }
}

// ---------- Photo capture ----------
const photoBtn = document.getElementById("photo-btn");
const photoInput = document.getElementById("photo-input");
const imagePreview = document.getElementById("image-preview");
const MAX_PHOTOS = 4;
let pendingImages = [];

photoBtn?.addEventListener("click", () => photoInput.click());

async function resizeImageFile(file, maxDimension = 900, quality = 0.7) {
  // Preferred path: createImageBitmap can downscale WHILE decoding, so the
  // browser never has to hold the full original (often 12-50MP) photo in
  // memory at once. This is what avoids the "not enough memory" crash on
  // phones/WebViews with limited heap.
  if ("createImageBitmap" in window) {
    try {
      const bitmap = await createImageBitmap(file, {
        resizeWidth: maxDimension,
        resizeQuality: "medium",
      });

      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();

      return canvas.toDataURL("image/jpeg", quality);
    } catch (err) {
      console.warn("createImageBitmap resize failed, falling back:", err);
      // fall through to the <img>-based method below
    }
  }

  // Fallback for older/unsupported browsers: decodes the full image first,
  // so it's more memory-hungry, but still works.
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(objectUrl);

      let { width, height } = img;
      if (width > height && width > maxDimension) {
        height = Math.round((height * maxDimension) / width);
        width = maxDimension;
      } else if (height > maxDimension) {
        width = Math.round((width * maxDimension) / height);
        height = maxDimension;
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      resolve(canvas.toDataURL("image/jpeg", quality));
    };

    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("Could not load the selected photo"));
    };

    img.src = objectUrl;
  });
}

function renderImagePreview() {
  imagePreview.innerHTML = "";

  pendingImages.forEach((dataUrl, index) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";

    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = `Selected photo ${index + 1}`;

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.setAttribute("aria-label", "Remove photo");
    removeBtn.innerHTML = "&times;";
    removeBtn.addEventListener("click", () => {
      pendingImages.splice(index, 1);
      renderImagePreview();
    });

    item.appendChild(img);
    item.appendChild(removeBtn);
    imagePreview.appendChild(item);
  });

  imagePreview.hidden = pendingImages.length === 0;
}

photoInput?.addEventListener("change", async () => {
  const files = Array.from(photoInput.files || []);
  if (!files.length) return;

  const room = MAX_PHOTOS - pendingImages.length;
  if (room <= 0) {
    alert(`You can attach up to ${MAX_PHOTOS} photos at a time.`);
    photoInput.value = "";
    return;
  }

  const filesToProcess = files.slice(0, room);
  if (files.length > room) {
    alert(`Only the first ${room} photo(s) were added (max ${MAX_PHOTOS} per message).`);
  }

  try {
    const resized = await Promise.all(filesToProcess.map((f) => resizeImageFile(f)));
    pendingImages.push(...resized);
    renderImagePreview();
  } catch (err) {
    console.error("Photo processing failed:", err);
    alert("Couldn't load one of those photos. Please try again.");
  } finally {
    photoInput.value = "";
  }
});

chatForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text && !pendingImages.length) return;
  inp.value = "";
  const imagesToSend = pendingImages;
  pendingImages = [];
  photoInput.value = "";
  renderImagePreview();
  sendMessage(text || "What's in this photo?", imagesToSend);
});
</script>
